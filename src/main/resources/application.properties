# Server Port
server.port=8080

# ==========================================
# Tomcat Server Concurrency Tuning
# ==========================================
# Max worker threads to process requests (Default: 200)
server.tomcat.max-threads=800
# Maximum connection queue length when all worker threads are busy (Default: 100)
server.tomcat.accept-count=1000
# Maximum concurrent connections Tomcat can handle (Default: 8192)
server.tomcat.max-connections=10000

# ==========================================
# H2 Database Configuration (In-Memory for Testing)
# ==========================================
spring.datasource.url=jdbc:h2:mem:eventdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console Configuration
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Hikari Connection Pool Optimizations for High Load
spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ==========================================
# Redis Configuration (Caching & Sessions)
# ==========================================
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Spring Session Redis Integration
spring.session.store-type=redis
spring.session.redis.namespace=eventmgmt:session
# Session expires in 30 minutes
server.servlet.session.timeout=1800s
# Cookie details
server.servlet.session.cookie.name=JSESSIONID
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.same-site=lax

# ==========================================
# Spring Mail Properties (Optional Mocking)
# ==========================================
spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# ==========================================
# Spring Cache Configuration
# ==========================================
# Enable Redis as Spring Cache backing store
spring.cache.type=none

# Redis Cache TTL
# spring.cache.redis.time-to-live=10m
# spring.cache.redis.use-key-prefix=true

# ==========================================
# Razorpay Configuration
# ==========================================
# Test API Keys (replace with your actual keys from Razorpay Dashboard)
razorpay.key.id=rzp_test_YOUR_KEY_ID
razorpay.key.secret=YOUR_KEY_SECRET
razorpay.currency=INR
