<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Event Management System</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Header -->
    <header>
        <div class="navbar">
            <div class="logo">
                <div>Event</div>
                <span>Hub</span>
            </div>
            <ul class="nav-links">
                <li><a href="index.html">Explore</a></li>
            </ul>
        </div>
    </header>

    <!-- Main Content -->
    <main>
        <div class="glass-panel" style="max-width: 400px; margin: 2rem auto; padding: 2rem;">
            <div class="logo" style="justify-content: center; margin-bottom: 2rem;">
                <div>Event</div>
                <span>Hub</span>
            </div>

            <h2 style="text-align: center; margin-bottom: 1.5rem;">Create Account</h2>
            <p style="text-align: center; color: var(--text-secondary); margin-bottom: 2rem;">Join our community</p>

            <form id="register-form">
                <div class="form-group">
                    <label for="username" class="form-label">Username</label>
                    <input type="text" id="username" class="form-control" required>
                </div>

                <div class="form-group">
                    <label for="email" class="form-label">Email Address</label>
                    <input type="email" id="email" class="form-control" required>
                </div>

                <div class="form-group">
                    <label for="fullName" class="form-label">Full Name</label>
                    <input type="text" id="fullName" class="form-control" required>
                </div>

                <div class="form-group">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" id="password" class="form-control" required>
                </div>

                <div class="form-group">
                    <label for="role" class="form-label">Role</label>
                    <select id="role" class="form-control" required>
                        <option value="ATTENDEE">Attendee</option>
                        <option value="ORGANIZER">Organizer</option>
                    </select>
                </div>

                <button type="submit" class="btn btn-primary w-100">Create Account</button>
            </form>

            <div class="login-footer" style="margin-top: 1.5rem; text-align: center; color: var(--text-muted); font-size: 0.9rem;">
                <p>Already have an account? <a href="login.html" style="color: var(--primary);">Sign in here</a></p>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <div class="footer-content">
            <p>&copy; 2026 Event Management System. All rights reserved.</p>
        </div>
    </footer>

    <script src="js/app.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
