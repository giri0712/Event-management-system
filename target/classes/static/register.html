<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - EventHub</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="navbar">
            <div class="logo"><span class="dot">&#x25C6;</span> EventHub</div>
            <ul class="nav-links">
                <li><a href="index.html">Explore</a></li>
            </ul>
            <div class="auth-nav"></div>
        </div>
    </header>

    <main>
        <div class="auth-container">
            <div class="auth-card">
                <h1>Create account</h1>
                <p class="subtitle">Join EventHub and start exploring events</p>
                <form id="register-form">
                    <div class="form-group">
                        <label for="fullName">Full Name</label>
                        <input type="text" id="fullName" placeholder="Enter your full name" required>
                    </div>
                    <div class="form-group">
                        <label for="username">Username</label>
                        <input type="text" id="username" placeholder="Choose a username" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" placeholder="Enter your email" required>
                    </div>
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" placeholder="Create a password" required minlength="6">
                    </div>
                    <div class="form-group">
                        <label for="role">I want to</label>
                        <select id="role">
                            <option value="ROLE_ATTENDEE">Attend events</option>
                            <option value="ROLE_ORGANIZER">Organize events</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-primary btn-lg">Create Account</button>
                </form>
                <p class="auth-footer">Already have an account? <a href="login.html">Sign in</a></p>
            </div>
        </div>
    </main>
    <script src="js/app.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
